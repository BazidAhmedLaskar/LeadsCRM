<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fameo CRM — Pending Approval</title>
<link rel="icon" type="image/svg+xml" href="https://fameomedia.vercel.app/img/fameo-logo.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="fameo-theme.css">
<script type="module" src="firebase-config.js"></script>
<script type="module" src="auth.js"></script>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="studio-strip">
  <span>Fameo · Influencer Marketing Agency</span>
  <span class="hide-mobile">Guwahati, Assam · 26.14° N · Northeast → Pan India</span>
  <a href="https://fameomedia.vercel.app/" target="_blank" rel="noopener">fameomedia.vercel.app ↗</a>
</div>

<div id="pendingScreen" class="screen active">
  <div class="auth-grid-bg"></div>
  <div class="auth-shell">
    <div class="auth-card auth-card-center">
      <div style="display:flex;justify-content:center;margin-bottom:24px;">
        <div class="fameo-logo" aria-label="Fameo CRM">
          <img
            class="fameo-brand-logo-lg"
            src="https://fameomedia.vercel.app/img/fameo-logo.svg?v=2"
            alt="Fameo — influencer marketing agency, Guwahati, Assam"
            onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex';"
          >
          <span class="fameo-logo-fallback">
            <svg class="fameo-logo-mark" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="1" y="1" width="34" height="34" rx="9" fill="#141413"/>
              <path d="M13 26V13.8C13 11.4 14.5 10 17.1 10H23.2" stroke="#FAF8F3" stroke-width="2.1" stroke-linecap="round"/>
              <path d="M10.8 18.2H20.8" stroke="#FAF8F3" stroke-width="2.1" stroke-linecap="round"/>
              <circle cx="25.5" cy="24.5" r="3" fill="#C84B31"/>
            </svg>
            <span class="fameo-wordmark">Fameo</span>
          </span>
          <span class="fameo-crm-tag">CRM</span>
        </div>
      </div>

      <div class="eyebrow" style="margin-bottom:10px;"><span class="eyebrow-dot"></span>00 — Account Review</div>
      <h1 class="editorial-title" style="font-size:2.2rem;margin-bottom:12px;">Waiting for <em>approval.</em></h1>
      <p style="font-size:0.88rem;color:var(--text-dim);line-height:1.7;margin-bottom:24px;">
        Your Google account has been registered. A Fameo team admin needs to approve access before you can view the lead pipeline.
      </p>

      <div class="user-pill" id="pendingPill"><span id="pendingEmail">—</span></div>

      <div>
        <button class="btn btn-ghost" id="pendingSignoutBtn" type="button" style="width:100%;">Sign Out →</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
